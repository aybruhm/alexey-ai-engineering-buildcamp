[project]
name = "pulumi-docs-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Abram", email = "55067204+aybruhm@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.14.0",
    "gitsource>=0.0.5",
    "httpx>=0.28.1",
    "minsearch>=0.2.0",
    "openinference-instrumentation-pydantic-ai>=0.1.30",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic-ai>=2.56.0",
    "python-dotenv>=1.2.4",
    "tqdm>=4.70.1",
]

[project.scripts]
pulumi-docs-agent = "pulumi_docs_agent.entrypoint:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
