[project]
name = "alexey-ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abram", email = "git.skimming549@passinbox.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.8.0",
    "dirdotenv>=0.0.3",
    "gitsource>=0.0.5",
    "httpx>=0.28.1",
    "jaxn>=0.0.5",
    "jupyter>=1.1.1",
    "markitdown[pdf]>=0.1.8",
    "minsearch>=0.2.0",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-frontmatter>=1.3.0",
    "sqlitesearch>=0.3.0",
    "tqdm>=4.70.1",
]

[project.scripts]
alexey-ai-engineering-buildcamp = "alexey_ai_engineering_buildcamp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.ruff.lint.isort]
known-first-party = ["extraction", "models", "pricing", "prompt", "rag", "retrieval", "utils"]
